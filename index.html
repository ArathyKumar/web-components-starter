<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components Starter</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;700&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="elements/button.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Web Components Starter</h1>
    </header>
    <main>
      <p>A starting point for custom elements and Shadow DOM.</p>
      <h2>Button</h2>
      <p>A custom element wrapping a native button, shown next to a regular HTML button.</p>
      <custom-button label="Web Component Button"></custom-button>
      <button type="button">Native Button</button>
    </main>
    <footer>
      <p>Built with native Web Components.</p>
    </footer>
  </body>
</html>
